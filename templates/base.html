<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}TrailNet{% endblock %}</title>
    <style>
        :root {
            --bg: #f4f6f3;
            --surface: #ffffff;
            --primary: #2d6a4f;
            --primary-dark: #1b4332;
            --text: #1f2933;
            --muted: #616e7c;
            --border: #d9e2ec;
            --danger-bg: #fde8e8;
            --danger-text: #9b1c1c;
            --success-bg: #def7ec;
            --success-text: #03543f;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.5;
        }
        nav {
            background: var(--primary-dark);
            color: #fff;
            padding: 0.9rem 1.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        nav .brand {
            font-weight: 700;
            font-size: 1.2rem;
            color: #fff;
            text-decoration: none;
        }
        nav .nav-links {
            display: flex;
            gap: 1rem;
            align-items: center;
        }
        nav a, nav button {
            color: #e6f4ea;
            text-decoration: none;
            font-size: 0.95rem;
            background: none;
            border: none;
            cursor: pointer;
            padding: 0;
            font-family: inherit;
        }
        nav a:hover, nav button:hover { text-decoration: underline; }
        .container {
            max-width: 960px;
            margin: 2rem auto;
            padding: 0 1rem;
        }
        .card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 1.75rem;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.04);
        }
        .auth-card {
            max-width: 480px;
            margin: 0 auto;
        }
        .messages {
            margin-bottom: 1.25rem;
        }
        .alert {
            padding: 0.8rem 1rem;
            border-radius: 6px;
            margin-bottom: 0.5rem;
            font-size: 0.95rem;
        }
        .alert-success {
            background: var(--success-bg);
            color: var(--success-text);
        }
        .alert-error {
            background: var(--danger-bg);
            color: var(--danger-text);
        }
        .form-group {
            margin-bottom: 1rem;
        }
        label {
            display: block;
            font-weight: 600;
            margin-bottom: 0.35rem;
            font-size: 0.92rem;
        }
        input, select, textarea {
            width: 100%;
            padding: 0.6rem 0.75rem;
            border: 1px solid var(--border);
            border-radius: 6px;
            font-size: 0.95rem;
            font-family: inherit;
        }
        input:focus, select:focus, textarea:focus {
            outline: 2px solid var(--primary);
            border-color: var(--primary);
        }
        .errorlist {
            list-style: none;
            padding: 0;
            margin: 0.3rem 0 0;
            color: var(--danger-text);
            font-size: 0.85rem;
        }
        .helptext {
            display: block;
            color: var(--muted);
            font-size: 0.82rem;
            margin-top: 0.25rem;
        }
        .btn {
            display: inline-block;
            background: var(--primary);
            color: #fff;
            border: none;
            border-radius: 6px;
            padding: 0.65rem 1.25rem;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
        }
        .btn:hover { background: var(--primary-dark); }
        .btn-full { width: 100%; }
        .muted { color: var(--muted); font-size: 0.9rem; }
    </style>
</head>
<body>
    <nav>
        <a href="/" class="brand">TrailNet</a>
        <div class="nav-links">
            {% block nav_links %}
                {% if user.is_authenticated %}
                    <span>Hi, {{ user.username }}</span>
                {% else %}
                    <a href="{% url 'accounts:register' %}">Register</a>
                {% endif %}
            {% endblock %}
        </div>
    </nav>

    <main class="container">
        {% if messages %}
            <div class="messages">
                {% for message in messages %}
                    <div class="alert alert-{{ message.tags }}">{{ message }}</div>
                {% endfor %}
            </div>
        {% endif %}

        {% block content %}{% endblock %}
    </main>
</body>
</html>
