{% extends 'base.html' %}

{% block title %}Access Denied | TrailNet{% endblock %}

{% block content %}
<div class="card auth-card">
    <h1 style="margin-top: 0; color: #9b1c1c;">403 — Access Denied</h1>
    <p>Your account role (<strong>{{ user.get_role_display }}</strong>) does not have permission to view this dashboard.</p>
    <a href="{% url 'accounts:dashboard_redirect' %}" class="btn">Go to My Dashboard</a>
</div>
{% endblock %}
